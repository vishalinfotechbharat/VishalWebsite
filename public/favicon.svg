<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Cyan to Blue Gradient -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <!-- Magenta to Purple Gradient -->
    <linearGradient id="magentaPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F355DA" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
  </defs>
  <!-- Chevron Left -->
  <path d="M11 5 L4 16 L11 27" stroke="url(#cyanBlue)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Slash Middle -->
  <path d="M13 28 L19 4" stroke="url(#magentaPurple)" stroke-width="3.5" stroke-linecap="round" />
  <!-- Chevron Right -->
  <path d="M21 5 L28 16 L21 27" stroke="url(#cyanBlue)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>